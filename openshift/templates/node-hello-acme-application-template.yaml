apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: node-hello-acme-application
  annotations:
    description: Deploy Hello Acme and expose it with an OpenShift Route.
    tags: openshift,nodejs,deployment,route,hello-acme
parameters:
  - name: host
    description: Fully qualified host name for the application Route.
    required: true
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: node-hello-acme
      labels:
        app: node-hello-acme
      annotations:
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"node-hello-acme:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: node-hello-acme
      template:
        metadata:
          labels:
            app: node-hello-acme
        spec:
          containers:
            - name: app
              image: node-hello-acme:latest
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 8080
              env:
                - name: PORT
                  value: "8080"
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 20
  - apiVersion: v1
    kind: Service
    metadata:
      name: node-hello-acme
      labels:
        app: node-hello-acme
    spec:
      selector:
        app: node-hello-acme
      ports:
        - name: http
          port: 8080
          targetPort: http
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: node-hello-acme
      labels:
        app: node-hello-acme
    spec:
      host: ${host}
      to:
        kind: Service
        name: node-hello-acme
      port:
        targetPort: http
