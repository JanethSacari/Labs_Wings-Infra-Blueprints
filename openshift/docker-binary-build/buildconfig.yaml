apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: go-binary-app
  labels:
    app: go-binary-app
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: go-binary-app
  labels:
    app: go-binary-app
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfile: |
        FROM registry.access.redhat.com/ubi9/ubi-minimal:9.6
        WORKDIR /opt/app
        COPY server /opt/app/server
        RUN chmod 0555 /opt/app/server
        USER 1001
        EXPOSE 8080
        ENV PORT=8080
        ENTRYPOINT ["/opt/app/server"]
  output:
    to:
      kind: ImageStreamTag
      name: go-binary-app:latest
