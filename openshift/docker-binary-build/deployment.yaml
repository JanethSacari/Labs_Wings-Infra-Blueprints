apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-binary-app
  labels:
    app: go-binary-app
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"go-binary-app:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-binary-app
  template:
    metadata:
      labels:
        app: go-binary-app
    spec:
      containers:
        - name: app
          image: go-binary-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: go-binary-app
  labels:
    app: go-binary-app
spec:
  selector:
    app: go-binary-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: go-binary-app
  labels:
    app: go-binary-app
spec:
  to:
    kind: Service
    name: go-binary-app
  port:
    targetPort: http
