apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-broken-pipeline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-broken-event-listener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-broken-pipeline-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: node-broken-pipeline
    namespace: REPLACE_WITH_PROJECT
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-broken-image-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: node-broken-pipeline
    namespace: REPLACE_WITH_PROJECT
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-broken-buildah-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: node-broken-pipeline
    namespace: REPLACE_WITH_PROJECT
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-broken-pipeline-run-creator
rules:
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-broken-event-listener-pipeline-run
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-broken-pipeline-run-creator
subjects:
  - kind: ServiceAccount
    name: node-broken-event-listener
    namespace: REPLACE_WITH_PROJECT
