apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: node-broken-deploy
spec:
  description: Apply the application Deployment, Service, and Route.
  params:
    - name: image
      type: string
  steps:
    - name: apply
      image: registry.access.redhat.com/openshift4/ose-cli:v4.18
      env:
        - name: IMAGE
          value: $(params.image)
      script: |
        set -eu
        cat <<EOF | oc apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: node-broken
          labels:
            app: node-broken
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: node-broken
          template:
            metadata:
              labels:
                app: node-broken
            spec:
              containers:
                - name: node-broken
                  image: ${IMAGE}
                  imagePullPolicy: Always
                  ports:
                    - name: http
                      containerPort: 8080
                  env:
                    - name: PORT
                      value: "8080"
                  readinessProbe:
                    httpGet:
                      path: /healthz
                      port: http
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                      path: /healthz
                      port: http
                    initialDelaySeconds: 15
                    periodSeconds: 20
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: node-broken
          labels:
            app: node-broken
        spec:
          selector:
            app: node-broken
          ports:
            - name: http
              port: 8080
              targetPort: http
        ---
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: node-broken
        spec:
          to:
            kind: Service
            name: node-broken
          port:
            targetPort: http
        EOF
        oc rollout status deployment/node-broken --timeout=90s
