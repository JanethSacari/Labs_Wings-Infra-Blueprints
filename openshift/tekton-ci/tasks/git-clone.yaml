apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: node-broken-git-clone
spec:
  description: Replace the previous checkout and clone a repository revision into the workspace.
  params:
    - name: url
      type: string
    - name: revision
      type: string
  workspaces:
    - name: source
  results:
    - name: source-path
      description: Absolute path to the checked-out source directory.
  steps:
    - name: clone
      image: alpine/git:v2.47.2
      env:
        - name: REPOSITORY_URL
          value: $(params.url)
        - name: REVISION
          value: $(params.revision)
      script: |
        set -eu
        SOURCE_PATH="$(workspaces.source.path)/repo"
        rm -rf "$SOURCE_PATH"
        mkdir -p "$SOURCE_PATH"
        git -C "$SOURCE_PATH" init
        git -C "$SOURCE_PATH" remote add origin "$REPOSITORY_URL"
        git -C "$SOURCE_PATH" fetch --depth=1 origin "$REVISION"
        git -C "$SOURCE_PATH" checkout --detach FETCH_HEAD
        printf '%s' "$SOURCE_PATH" > "$(results.source-path.path)"
