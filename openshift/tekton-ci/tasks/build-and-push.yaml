apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: node-broken-build-and-push
spec:
  description: Build the Node.js image with an OpenShift BuildConfig and push it to the internal registry.
  params:
    - name: source-path
      type: string
    - name: app-path
      type: string
    - name: image-tag
      type: string
  workspaces:
    - name: source
  results:
    - name: image-url
      description: Full image reference pushed to the internal registry.
  steps:
    - name: build-and-push
      image: registry.access.redhat.com/openshift4/ose-cli:v4.18
      env:
        - name: SOURCE_PATH
          value: $(params.source-path)
        - name: APP_PATH
          value: $(params.app-path)
        - name: IMAGE_TAG
          value: $(params.image-tag)
        - name: RUN_ID
          value: $(context.pipelineRun.uid)
      script: |
        set -eu

        case "$IMAGE_TAG" in
          ""|*[!a-zA-Z0-9_.-]*|[-.]*)
            echo "Invalid container image tag: $IMAGE_TAG" >&2
            exit 1
            ;;
        esac
        if [ "${#IMAGE_TAG}" -gt 128 ]; then
          echo "Container image tags cannot exceed 128 characters" >&2
          exit 1
        fi

        case "$APP_PATH" in
          ""|/*|../*|*/../*|*/..)
            echo "Invalid application path: $APP_PATH" >&2
            exit 1
            ;;
        esac

        SOURCE_DIR="${SOURCE_PATH}/${APP_PATH}"
        test -f "$SOURCE_DIR/Dockerfile"

        NAMESPACE="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
        REGISTRY="image-registry.openshift-image-registry.svc:5000"
        IMAGE="${REGISTRY}/${NAMESPACE}/node-broken:${IMAGE_TAG}"
        BUILD_CONFIG="node-broken-${RUN_ID}"

        oc create imagestream node-broken --dry-run=client -o yaml | oc apply -f -
        cat <<EOF | oc apply -f -
        apiVersion: build.openshift.io/v1
        kind: BuildConfig
        metadata:
          name: ${BUILD_CONFIG}
          labels:
            app: node-broken
        spec:
          runPolicy: Serial
          source:
            type: Binary
            binary: {}
          strategy:
            type: Docker
            dockerStrategy: {}
          output:
            to:
              kind: ImageStreamTag
              name: node-broken:${IMAGE_TAG}
        EOF

        oc start-build "$BUILD_CONFIG" --from-dir "$SOURCE_DIR" --follow --wait
        printf '%s' "$IMAGE" > "$(results.image-url.path)"
