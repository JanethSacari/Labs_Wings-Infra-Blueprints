apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: node-broken-build-and-push
spec:
  description: Build the Node.js container image and push it to the OpenShift registry.
  params:
    - name: source-path
      type: string
    - name: app-path
      type: string
    - name: image-tag
      type: string
  workspaces:
    - name: source
  results:
    - name: image-url
      description: Full image reference pushed to the internal registry.
  steps:
    - name: prepare-image-stream
      image: registry.access.redhat.com/openshift4/ose-cli:v4.18
      script: |
        set -eu
        oc create imagestream node-broken --dry-run=client -o yaml | oc apply -f -
    - name: build-and-push
      image: registry.access.redhat.com/ubi9/buildah:latest
      securityContext:
        privileged: true
        runAsUser: 0
      env:
        - name: SOURCE_PATH
          value: $(params.source-path)
        - name: APP_PATH
          value: $(params.app-path)
        - name: IMAGE_TAG
          value: $(params.image-tag)
      script: |
        set -eu

        case "$IMAGE_TAG" in
          ""|*[!a-zA-Z0-9_.-]*|[-.]*)
            echo "Invalid container image tag: $IMAGE_TAG" >&2
            exit 1
            ;;
        esac
        if [ "${#IMAGE_TAG}" -gt 128 ]; then
          echo "Container image tags cannot exceed 128 characters" >&2
          exit 1
        fi

        NAMESPACE="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
        REGISTRY="image-registry.openshift-image-registry.svc:5000"
        IMAGE="${REGISTRY}/${NAMESPACE}/node-broken:${IMAGE_TAG}"
        SOURCE_DIR="${SOURCE_PATH}/${APP_PATH}"

        test -f "$SOURCE_DIR/Dockerfile"
        TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
        AUTH_FILE=/tmp/registry-auth.json

        printf '%s' "$TOKEN" | buildah login \
          --tls-verify=false \
          --authfile "$AUTH_FILE" \
          --username "system:serviceaccount:${NAMESPACE}:node-broken-pipeline" \
          --password-stdin \
          "$REGISTRY"
        buildah bud \
          --storage-driver=vfs \
          --isolation=chroot \
          --format=docker \
          --file "$SOURCE_DIR/Dockerfile" \
          --tag "$IMAGE" \
          "$SOURCE_DIR"
        buildah push \
          --storage-driver=vfs \
          --authfile "$AUTH_FILE" \
          --tls-verify=false \
          "$IMAGE" \
          "docker://$IMAGE"

        printf '%s' "$IMAGE" > "$(results.image-url.path)"
